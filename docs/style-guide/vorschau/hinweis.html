<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Vorschau Hinweis</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bundle.css">
<style>body { margin: 0; background: #fff; }</style>
</head><body>
<!-- @dsCard group="Bedienelemente" height=450 width=720 subtitle="Hinweis links neben der gewählten Zeile, darunter ein Hinweis für sich · Oberflächenpixel ×2" -->
<div class="pv" style="background: var(--nacht)">
  <div class="pv-col">
    <div class="pv-szene">
      <p class="cl-hinweis" style="position: absolute; right: 148px; top: 20px">Der Laden hat noch zu. Bald kannst du ihn eröffnen.</p>
      <nav class="cl-menue" aria-label="Hauptmenü im Prototyp" style="position: absolute; right: 0; top: 0">
        <span class="cl-lochrand links" aria-hidden="true"></span>
        <span class="cl-lochrand rechts" aria-hidden="true"></span>
        <p class="kopfzeile">HAUPTMENÜ</p>
        <button type="button" class="ist-aktiv" disabled>Neues Spiel</button>
        <button type="button" disabled>Spiel laden</button>
        <button type="button" disabled>Einstellungen</button>
        <button type="button">Beenden</button>
      </nav>
    </div>
    <span class="pv-cap hell">Neben der gewählten Zeile, auch wenn sie nicht verfügbar ist</span>
  </div>
  <div class="pv-col">
    <p class="cl-hinweis">Laden abschließen und zurück zum Desktop.</p>
    <span class="pv-cap hell">Für sich</span>
  </div>
</div>
</body></html>
