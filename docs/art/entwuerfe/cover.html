<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cover-Entwurf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&amp;family=Pixelify+Sans:wght@400..700&amp;family=Saira:ital,wdth,wght@0,125,800..900;1,125,800..900&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; width: 900px; height: 1350px; overflow: hidden; background: #57351d; color: #f5f0e2">
<img src="../leonardo/c-01-cover.jpg" alt="Der Ladenbesitzer hinter der Theke seines vollen Computerladens, Pixel-Art" style="position: absolute; left: 0; top: 0; display: block; width: 900px; height: 1350px; object-fit: cover; image-rendering: pixelated">
<div style="position: absolute; left: 0; top: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; width: 900px; height: 56px; padding: 0 32px; border-bottom: 3px solid #1d1916; background: #bdb39a; box-shadow: inset 3px 3px 0 #e4dcc6, inset -3px -3px 0 #6f6654; font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 20px; line-height: 24px; color: #1d1916">
<span>FÜR WINDOWS, MACOS UND LINUX</span>
<span style="font-family: Doto, 'Courier New', monospace; font-weight: 700; letter-spacing: 2px">DEUTSCH</span>
</div>
<div style="position: absolute; left: 48px; top: 80px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
<h1 style="margin: 0; line-height: 0"><img src="../leonardo/logo-ladenschild.png" alt="Der Computerladen" style="display: block; width: 700px; height: auto; image-rendering: pixelated; filter: drop-shadow(6px 6px 0 #1d1916)"></h1>
<p style="margin: 0 0 0 8px; padding: 2px 8px; background: #1d1916; font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: 22px; line-height: 26px; letter-spacing: 2px; color: #f5f0e2">DIE WIRTSCHAFTSSIMULATION · 1985–1999</p>
</div>
<div style="position: absolute; right: 36px; top: 1030px; display: flex; align-items: center; justify-content: center; width: 124px; height: 124px; border-radius: 50%; background: #c0392b; box-shadow: 6px 6px 0 #1d1916; transform: rotate(-12deg); font-family: Saira, 'Arial Black', sans-serif; font-stretch: 125%; font-style: italic; font-weight: 900; font-size: 20px; line-height: 1.05; text-align: center; color: #f5f0e2">VOLLE<br>256<br>FARBEN</div>
<div style="position: absolute; left: 0; top: 1180px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 900px; height: 170px; padding: 0 40px; border-top: 3px solid #1d1916; background: repeating-linear-gradient(#f5f0e2 0 42px, #cfe2c3 42px 84px)">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background-image: radial-gradient(circle, #1d1916 0 6px, transparent 6px); background-size: 24px 36px; background-position: 0 6px"></span>
<span aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 24px; background-image: radial-gradient(circle, #1d1916 0 6px, transparent 6px); background-size: 24px 36px; background-position: 0 6px"></span>
<p style="margin: 0; font-family: Doto, 'Courier New', monospace; font-size: 40px; line-height: 48px; font-weight: 800; letter-spacing: 2px; text-align: center; color: #1d1916">ALS COMPUTER NOCH BEIGE WAREN.</p>
</div>
</div>
</body>
</html>
